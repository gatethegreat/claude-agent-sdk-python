<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Agent</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 1rem 2rem;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        header h1 {
            font-size: 1.5rem;
            color: #e94560;
        }

        .status {
            margin-left: auto;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status.disconnected {
            background: #ff6b6b33;
            color: #ff6b6b;
        }

        .status.connected {
            background: #51cf6633;
            color: #51cf66;
        }

        .status.connecting {
            background: #ffd43b33;
            color: #ffd43b;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            min-height: 0; /* Allow flex child to shrink */
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 0; /* Allow scrolling */
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background: #0f3460;
            color: #fff;
        }

        .message.assistant {
            align-self: flex-start;
            background: #16213e;
            border: 1px solid #0f3460;
        }

        .message.system {
            align-self: center;
            background: #0f346033;
            color: #888;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
        }

        .tool-use {
            background: #e9456015;
            border: 1px solid #e94560;
            border-radius: 8px;
            padding: 0.75rem;
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }

        .tool-use .tool-name {
            color: #e94560;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tool-use .tool-name::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #e94560;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        .tool-use.completed .tool-name::before {
            animation: none;
            background: #51cf66;
        }

        .tool-use .tool-result {
            margin-top: 0.5rem;
            color: #aaa;
            font-family: monospace;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .input-container {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            background: #16213e;
            border-radius: 12px;
            margin-top: 1rem;
            flex-shrink: 0;
        }

        #message-input {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        #message-input:focus {
            box-shadow: 0 0 0 2px #e94560;
        }

        #message-input::placeholder {
            color: #666;
        }

        button {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            background: #e94560;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #d63d56;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .tools-panel {
            background: #16213e;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .tools-panel h3 {
            color: #e94560;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tools-list {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tool-badge {
            background: #0f3460;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .streaming-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #e94560;
            border-radius: 50%;
            margin-left: 4px;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .examples {
            margin-top: 1rem;
            padding: 1rem;
            background: #16213e;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .examples h3 {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
        }

        .examples button {
            background: #0f3460;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            margin: 0.25rem;
        }

        .examples button:hover {
            background: #1a4a7a;
        }
    </style>
</head>
<body>
    <header>
        <h1>Calculator Agent</h1>
        <div class="status disconnected" id="status">Disconnected</div>
    </header>

    <main>
        <div class="chat-container" id="chat-container">
            <!-- Messages will appear here -->
        </div>

        <div class="examples">
            <h3>Try these examples:</h3>
            <button onclick="sendExample('What is 5 + 3?')">5 + 3</button>
            <button onclick="sendExample('Calculate 12 times 7')">12 * 7</button>
            <button onclick="sendExample('Divide 100 by 4')">100 / 4</button>
            <button onclick="sendExample('What is (5 + 3) * 2?')">Complex: (5+3)*2</button>
        </div>

        <div class="input-container">
            <input
                type="text"
                id="message-input"
                placeholder="Ask me to calculate something..."
                disabled
            >
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </main>

    <script>
        let ws = null;
        let isConnected = false;
        let currentAssistantMessage = null;

        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');

        function updateStatus(status) {
            statusEl.className = 'status ' + status;
            statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        function addMessage(type, content, toolInfo = null) {
            const div = document.createElement('div');
            div.className = 'message ' + type;

            if (toolInfo) {
                div.innerHTML = `
                    <div class="tool-use ${toolInfo.completed ? 'completed' : ''}">
                        <div class="tool-name">${toolInfo.name}</div>
                        ${toolInfo.result ? `<div class="tool-result">${toolInfo.result}</div>` : ''}
                    </div>
                `;
            } else {
                div.textContent = content;
            }

            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function connect() {
            updateStatus('connecting');

            ws = new WebSocket('ws://localhost:8001/ws');

            ws.onopen = () => {
                console.log('WebSocket connected');
                // Send connect message
                ws.send(JSON.stringify({ type: 'connect' }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);

                switch (data.type) {
                    case 'connected':
                        isConnected = true;
                        updateStatus('connected');
                        messageInput.disabled = false;
                        sendBtn.disabled = false;
                        // Don't add system message - status indicator shows connection state
                        break;

                    case 'stream_text':
                        if (!currentAssistantMessage) {
                            currentAssistantMessage = addMessage('assistant', '');
                        }
                        currentAssistantMessage.textContent += data.content;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                        break;

                    case 'tool_use_start':
                        // Reset currentAssistantMessage so post-tool text creates a new bubble
                        currentAssistantMessage = null;
                        addMessage('assistant', '', {
                            name: `Using tool: ${data.tool_name}`,
                            completed: false
                        });
                        break;

                    case 'assistant':
                        // Final message - only add if we don't already have streamed content
                        // Don't overwrite - streaming already populated the message
                        if (!currentAssistantMessage && data.content) {
                            // No streaming happened, add the full message
                            addMessage('assistant', data.content);
                        }

                        // Tools are already shown as tool_use_start events during streaming
                        currentAssistantMessage = null;
                        messageInput.disabled = false;
                        sendBtn.disabled = false;
                        break;

                    case 'error':
                        addMessage('system', `Error: ${data.message}`);
                        messageInput.disabled = false;
                        sendBtn.disabled = false;
                        break;
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                isConnected = false;
                updateStatus('disconnected');
                messageInput.disabled = true;
                sendBtn.disabled = true;
                // Don't add system message - status indicator shows connection state

                // Reconnect after 2 seconds
                setTimeout(connect, 2000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addMessage('system', 'Connection error. Make sure the backend is running on port 8001.');
            };
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !isConnected) return;

            addMessage('user', content);
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            currentAssistantMessage = null;

            ws.send(JSON.stringify({
                type: 'message',
                content: content
            }));
        }

        function sendExample(text) {
            if (!isConnected) return;
            messageInput.value = text;
            sendMessage();
        }

        // Handle Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Start connection
        connect();
    </script>
</body>
</html>

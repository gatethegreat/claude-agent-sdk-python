<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copywriting Agent</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 1rem 2rem;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.5rem;
            color: #4ecdc4;
        }

        .client-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: 1rem;
        }

        .client-selector label {
            font-size: 0.9rem;
            color: #888;
        }

        .client-selector input {
            padding: 0.5rem 1rem;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #0f3460;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .client-selector input:focus {
            border-color: #4ecdc4;
        }

        .status {
            margin-left: auto;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status.disconnected {
            background: #ff6b6b33;
            color: #ff6b6b;
        }

        .status.connected {
            background: #51cf6633;
            color: #51cf66;
        }

        .status.connecting {
            background: #ffd43b33;
            color: #ffd43b;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
            min-height: 0;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 0;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background: #0f3460;
            color: #fff;
        }

        .message.assistant {
            align-self: flex-start;
            background: #16213e;
            border: 1px solid #0f3460;
        }

        .message.system {
            align-self: center;
            background: #0f346033;
            color: #888;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
        }

        .tool-use {
            background: #4ecdc415;
            border: 1px solid #4ecdc4;
            border-radius: 8px;
            padding: 0.75rem;
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }

        .tool-use .tool-name {
            color: #4ecdc4;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tool-use .tool-name::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ecdc4;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        .tool-use.completed .tool-name::before {
            animation: none;
            background: #51cf66;
        }

        .tool-use .tool-result {
            margin-top: 0.5rem;
            color: #aaa;
            font-family: monospace;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .input-container {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            background: #16213e;
            border-radius: 12px;
            margin-top: 1rem;
            flex-shrink: 0;
        }

        #message-input {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: #fff;
            font-size: 1rem;
            outline: none;
            resize: none;
            min-height: 50px;
            max-height: 150px;
        }

        #message-input:focus {
            box-shadow: 0 0 0 2px #4ecdc4;
        }

        #message-input::placeholder {
            color: #666;
        }

        button {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            background: #4ecdc4;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #45b7aa;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .examples {
            margin-top: 1rem;
            padding: 1rem;
            background: #16213e;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .examples h3 {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
        }

        .examples button {
            background: #0f3460;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            margin: 0.25rem;
            color: #eee;
        }

        .examples button:hover {
            background: #1a4a7a;
        }

        .streaming-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #4ecdc4;
            border-radius: 50%;
            margin-left: 4px;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Copywriting Agent</h1>
        <div class="client-selector">
            <label for="client-name">Client:</label>
            <input type="text" id="client-name" placeholder="Enter client name...">
        </div>
        <div class="status disconnected" id="status">Disconnected</div>
    </header>

    <main>
        <div class="chat-container" id="chat-container">
            <!-- Messages will appear here -->
        </div>

        <div class="examples">
            <h3>Try these prompts:</h3>
            <button onclick="sendExample('Write 5 email subject lines for a holiday sale')">Holiday Subject Lines</button>
            <button onclick="sendExample('Create a product description for our bestseller')">Product Description</button>
            <button onclick="sendExample('Write social media ad copy for a new product launch')">Social Ad Copy</button>
        </div>

        <div class="input-container">
            <textarea
                id="message-input"
                placeholder="Describe what copy you need..."
                disabled
                rows="1"
            ></textarea>
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </main>

    <script>
        let ws = null;
        let isConnected = false;
        let currentAssistantMessage = null;

        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');
        const clientNameInput = document.getElementById('client-name');

        function updateStatus(status) {
            statusEl.className = 'status ' + status;
            statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        function addMessage(type, content, toolInfo = null) {
            const div = document.createElement('div');
            div.className = 'message ' + type;

            if (toolInfo) {
                div.innerHTML = `
                    <div class="tool-use ${toolInfo.completed ? 'completed' : ''}">
                        <div class="tool-name">${toolInfo.name}</div>
                        ${toolInfo.result ? `<div class="tool-result">${toolInfo.result}</div>` : ''}
                    </div>
                `;
            } else {
                div.textContent = content;
            }

            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function connect() {
            updateStatus('connecting');

            ws = new WebSocket('ws://localhost:8002/ws');

            ws.onopen = () => {
                console.log('WebSocket connected');
                // Send connect message with client name
                const clientName = clientNameInput.value.trim();
                ws.send(JSON.stringify({
                    type: 'connect',
                    client_name: clientName || null
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);

                switch (data.type) {
                    case 'connected':
                        isConnected = true;
                        updateStatus('connected');
                        messageInput.disabled = false;
                        sendBtn.disabled = false;
                        break;

                    case 'stream_text':
                        if (!currentAssistantMessage) {
                            currentAssistantMessage = addMessage('assistant', '');
                        }
                        currentAssistantMessage.textContent += data.content;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                        break;

                    case 'tool_use_start':
                        // Reset currentAssistantMessage so post-tool text creates a new bubble
                        currentAssistantMessage = null;
                        // Strip MCP prefix for cleaner display
                        const toolName = data.tool_name.replace('mcp__copywriting__', '');
                        addMessage('assistant', '', {
                            name: `Searching: ${toolName}`,
                            completed: false
                        });
                        break;

                    case 'assistant':
                        // Final message - only add if we don't already have streamed content
                        if (!currentAssistantMessage && data.content) {
                            addMessage('assistant', data.content);
                        }

                        currentAssistantMessage = null;
                        messageInput.disabled = false;
                        sendBtn.disabled = false;
                        break;

                    case 'error':
                        addMessage('system', `Error: ${data.message}`);
                        messageInput.disabled = false;
                        sendBtn.disabled = false;
                        break;
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                isConnected = false;
                updateStatus('disconnected');
                messageInput.disabled = true;
                sendBtn.disabled = true;

                // Reconnect after 2 seconds
                setTimeout(connect, 2000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addMessage('system', 'Connection error. Make sure the backend is running on port 8002.');
            };
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !isConnected) return;

            addMessage('user', content);
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            currentAssistantMessage = null;

            ws.send(JSON.stringify({
                type: 'message',
                content: content
            }));
        }

        function sendExample(text) {
            if (!isConnected) return;
            messageInput.value = text;
            sendMessage();
        }

        // Handle Enter key (Shift+Enter for newline)
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
        });

        // Reconnect with new client name when changed
        clientNameInput.addEventListener('change', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
        });

        // Start connection
        connect();
    </script>
</body>
</html>
